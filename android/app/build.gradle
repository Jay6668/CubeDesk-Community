plugins { id 'com.android.application'; id 'com.chaquo.python' }
android {
 namespace 'org.cubedesk.community'
 compileSdk 36
 defaultConfig { applicationId 'org.cubedesk.community'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0'; ndk { abiFilters 'arm64-v8a','x86_64' } }
 buildFeatures { buildConfig true }
 // Local review APK only. A public release needs its own owner-controlled signing key.
 buildTypes { release { debuggable false; minifyEnabled false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy { defaultConfig { version='3.13'; buildPython(System.getenv('CUBEDESK_BUILD_PYTHON') ?: 'python') } }
dependencies { implementation 'androidx.core:core:1.15.0' }
