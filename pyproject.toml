[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cubedesk-community"
version = "0.1.0"
description = "Independent CubeDesk basic practice and development edition"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
desktop = ["bleak==3.0.2", "pywebview==6.2.1", "pycryptodome==3.23.0"]
test = ["pycryptodome==3.23.0"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
cubedesk-community = "cubedesk_community.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/cubedesk-community/web" = ["web/index.html", "web/style.css", "web/app.js", "web/icon.svg"]
"share/cubedesk-community/web/renderer" = ["web/renderer/cube3d.js", "web/renderer/skins.js"]
"share/cubedesk-community/licenses" = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/smartcube-web-bluetooth-MIT.txt"]
"share/cubedesk-community/licenses/third_party" = ["third_party/*.txt"]
